[wireless]
command=nmcli -t -f active,ssid,signal dev wifi | awk -F: '$1=="yes" {print "W: " $2 " (" $3 "%)"}'
interval=5

[ethernet]
command=ip -br addr show enp0s31f6 | awk '$2 == "UP" {print "E: " $3}'
interval=5

[battery]
command=awk -F= '/^POWER_SUPPLY_STATUS=/ {s=$2} /^POWER_SUPPLY_CAPACITY=/ {p=$2} END {if (s == "Charging") print "⚡ CHR "p"%"; else if (s == "Discharging") print "🔋 BAT "p"%"; else if (s == "Full") print "FULL"; else print "? UNK"}' /sys/class/power_supply/BAT0/uevent
interval=5

[memory]
command=free -h | awk '/^Mem:/ {printf "M: %s/%s", $7, $2}'
interval=1

[cpu]
command=top -bn1 | awk '/Cpu\(s\)/ {printf "cpu: %d%%", $2+$4}'
interval=1

[volume-mic]
command=dev=$(pactl info 2>/dev/null | awk '/Default Source/{print $NF}'); desc=$(pactl list sources 2>/dev/null | awk -v d="$dev" '/Name: /{name=$NF} /Description: /{sub(/^[ \t]*Description: /,"",$0); if(name==d){print $0; exit}}' | sed 's/\&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'); v=$(amixer -D default get Capture 2>/dev/null | awk -F'[][]' '/%/ {v=$2; s=$4} END {if(s=="off") print "<span foreground=\"#FFFF00\">(mute)</span>"; else print "(" v ")"}'); [ -n "$desc" ] && echo "mic: [$desc] $v" || echo "mic: $v"
markup=pango
interval=1

[volume-master]
command=dev=$(pactl info 2>/dev/null | awk '/Default Sink/{print $NF}'); desc=$(pactl list sinks 2>/dev/null | awk -v d="$dev" '/Name: /{name=$NF} /Description: /{sub(/^[ \t]*Description: /,"",$0); if(name==d){print $0; exit}}' | sed 's/\&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'); v=$(amixer -D default get Master 2>/dev/null | awk -F'[][]' '/%/ {v=$2; s=$4} END {if(s=="off") print "<span foreground=\"#FFFF00\">(mute)</span>"; else print "(" v ")"}'); [ -n "$desc" ] && echo "🕪 [$desc] $v" || echo "🕪 $v"
markup=pango
interval=1

[disk-root]
command=df -h / | awk 'NR==2 {print "root: " $4 "/" $2}'
interval=5

[disk-data]
command=df -h /data | awk 'NR==2 {print "Data: " $4}'
interval=5

[local]
command=date '+%Y-%m-%d (%a) %H:%M:%S'
interval=1

[kanata-mode]
command=awk 'BEGIN {colors["BASE"]="#FFFFFF"; colors["INSERT"]="#00FF00"; colors["NORMAL"]="#00BFFF"; colors["VISUAL"]="#FFFF00"; colors["VISUAL-LINE"]="#FF00FF"; colors["MOUSE"]="#FFC0CB"} {print $0; print $0; print ($0 in colors ? colors[$0] : "#FFFFFF")}' /home/ccw/.cache/kanata-mode
interval=1
